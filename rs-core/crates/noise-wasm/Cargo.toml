[package]
name = "noise-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
acoustics = ["noise-core/acoustics"]
speech = ["acoustics", "noise-core/speech"]
harmonicity = ["speech", "noise-core/harmonicity"]

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
noise-core = { path = "../noise-core" }

[[example]]
name = "harmonicity_driver"
required-features = ["harmonicity"]

[[example]]
name = "support_driver"
required-features = ["speech"]

[[example]]
name = "segments_driver"
required-features = ["harmonicity"]

[[example]]
name = "pcm_driver"
required-features = ["speech"]

[[example]]
name = "pitch_session_driver"
required-features = ["speech"]

[[example]]
name = "resample_session_driver"
required-features = ["speech"]
